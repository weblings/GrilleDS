name: Release

# A v* tag builds the package and publishes the npm pack tarball as a release
# asset. Grille commits no dist, so consumers install from that asset's URL:
#   https://github.com/weblings/GrilleDS/releases/download/vX.Y.Z/weblings-grille-X.Y.Z.tgz
# Never re-upload or replace an asset: consumers' lockfiles record its integrity
# hash, and a changed hash fails their npm ci. To fix a bad release, cut a new tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag must match package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      # npm ci runs prepare, so this also builds dist and the tokens.
      - run: npm ci
      - run: npm test
      # npm pack reruns prepare (a rebuild), so its stdout is not clean JSON;
      # find the tarball by name instead.
      - name: Pack
        run: |
          npm pack
          set -- weblings-grille-*.tgz
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "expected exactly one tarball" >&2; exit 1; }
          echo "TARBALL=$1" >> "$GITHUB_ENV"
      - name: Publish release (fails if the release already exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A hyphen in the tag (v0.1.0-dev.1) marks a prerelease: still a public URL.
          flag=""
          case "${GITHUB_REF_NAME}" in *-*) flag="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" "${TARBALL}" --title "${GITHUB_REF_NAME}" --generate-notes ${flag}
