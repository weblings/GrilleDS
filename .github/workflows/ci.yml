name: CI

# PRs only. A merge to main was already checked on its PR, and pages.yml rebuilds
# the catalog from main on merge.
on:
  pull_request:

# A newer push to the same PR cancels the run still checking the older commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Tokens diff fixture reads tokens.json at origin/main.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci runs prepare, so this also builds the package and tokens.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run cosmos:export
